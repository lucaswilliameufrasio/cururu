name: "Cururu PR Review"
description: "Stateless LLM-powered PR review for GitHub Actions"
author: "Lucas Eufrasio"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  mode:
    description: "prepare: review and show a candidate without commenting; publish: post an approved candidate from a job gated by a protected environment"
    required: false
    default: prepare
  candidate_digest:
    description: "Publish mode: the review job's candidate_digest output"
    required: false
  candidate_path:
    description: "Path of the candidate file written in prepare mode and read in publish mode"
    required: false
    default: cururu-candidate.json
  approval_environment:
    description: "Publish mode: GitHub Environment that must require reviewers and be approved for this run"
    required: false
    default: cururu-publish
  github_token:
    description: "GitHub token for API access"
    required: false
    default: ${{ github.token }}
  shared_config_token:
    description: "Optional token with read access to a shared config repository in another GitHub App installation"
    required: false
  llm_api_key:
    description: "LLM provider API key (required in prepare mode, unused in publish mode)"
    required: false
  llm_base_url:
    description: "LLM API base URL (overrides provider default)"
    required: false
  llm_model:
    description: "Model name (overrides provider default)"
    required: false
  cururu_provider:
    description: "Provider name (openai, openrouter, groq)"
    required: false
  pr_number:
    description: "Pull request number"
    required: false
    default: ${{ github.event.pull_request.number || github.event.issue.number }}
  expected_head_sha:
    description: "Expected pull request head commit SHA; publication is skipped if the PR has moved"
    required: false
  cururu_language:
    description: "Review language (e.g. pt-BR, en-US)"
    required: false
  cururu_profile:
    description: "Review profile (balanced, strict, security, minimal)"
    required: false
  cururu_fail_on:
    description: "Fail the action on this severity (off, critical, high, medium, low)"
    required: false

outputs:
  review_status:
    description: "pending_approval, not_approvable or skipped_diff_limit in prepare mode; completed in publish mode. None of these is a code approval"
  candidate_digest:
    description: "SHA-256 of the candidate preview, required by publish mode"
  candidate_path:
    description: "Path of the prepared candidate file"
  quality_gate:
    description: "Quality gate status"
  quality_gate_passed:
    description: "Whether the quality gate passed"
  findings_count:
    description: "Number of accepted findings"
  critical_count:
    description: "Number of critical findings"
  high_count:
    description: "Number of high findings"
  medium_count:
    description: "Number of medium findings"
  low_count:
    description: "Number of low findings"
  highest_severity:
    description: "Highest finding severity"
  analysis_status:
    description: "Analyzer evidence status (disabled, passed, failed, partial, stale, no_evidence)"
  analysis_tools_total:
    description: "Total number of analyzer tools reported"
  analysis_tools_failed:
    description: "Number of analyzer tools that failed"
  analysis_tools_not_run:
    description: "Number of analyzer tools that did not run"
  analysis_findings_count:
    description: "Number of analyzer findings published"

runs:
  using: "docker"
  image: docker://ghcr.io/lucaswilliameufrasio/cururu@sha256:52dc129c82a4b42389601dd84b5c98c2d7ac64da511929f0b9dc4f084a008b57
  args:
    - ${{ inputs.mode == 'publish' && 'publish-approved-review' || 'review' }}
  env:
    GITHUB_TOKEN: ${{ inputs.github_token }}
    CURURU_SHARED_CONFIG_TOKEN: ${{ inputs.shared_config_token }}
    LLM_API_KEY: ${{ inputs.llm_api_key }}
    LLM_BASE_URL: ${{ inputs.llm_base_url }}
    LLM_MODEL: ${{ inputs.llm_model }}
    CURURU_PROVIDER: ${{ inputs.cururu_provider }}
    PR_NUMBER: ${{ inputs.pr_number }}
    EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
    CURURU_LANGUAGE: ${{ inputs.cururu_language }}
    CURURU_PROFILE: ${{ inputs.cururu_profile }}
    CURURU_FAIL_ON: ${{ inputs.cururu_fail_on }}
    CURURU_CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
    CURURU_CANDIDATE_PATH: ${{ inputs.candidate_path }}
    CURURU_APPROVAL_ENVIRONMENT: ${{ inputs.approval_environment }}
