# Example for a private shared base in a separate GitHub organization.
# Keep .cururu.toml and all context files on the trusted base commit.
name: Cururu PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

jobs:
  gate:
    # Validates comment commands without joining the concurrency group, so
    # unrelated, mis-cased or unauthorized comments never cancel a review.
    # Cururu still checks the commenter's write permission itself.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      run: ${{ steps.command.outputs.run }}
    steps:
      - name: Accept PR events and exact commands from collaborators
        id: command
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          run=false
          if [ "$EVENT" = "pull_request_target" ]; then
            run=true
          else
            body="$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR)
                if [ "$body" = "/cururu review" ] || [ "$body" = "/cururu review --full" ]; then
                  run=true
                fi
                ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Only validated events reach this group; a newer review cancels an older one.
    concurrency:
      group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # This token can read the consumer repo and write Cururu PR/issue comments.
      - name: Mint consumer installation token
        id: consumer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CURURU_APP_ID }}
          private-key: ${{ secrets.CURURU_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-checks: read
          permission-pull-requests: write
          permission-issues: write

      # This separate installation token is read-only and scoped to the base repo.
      - name: Mint shared-config installation token
        id: base-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CURURU_APP_ID }}
          private-key: ${{ secrets.CURURU_APP_PRIVATE_KEY }}
          owner: ${{ vars.CURURU_BASE_OWNER }}
          repositories: ${{ vars.CURURU_BASE_REPOSITORY }}
          permission-contents: read

      - name: Review PR
        uses: lucaswilliameufrasio/cururu@601b4e125b7dd865c6adab289d2d8948f1e5c841 # v4.8.0
        with:
          github_token: ${{ steps.consumer-token.outputs.token }}
          shared_config_token: ${{ steps.base-token.outputs.token }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          expected_head_sha: ${{ github.event.pull_request.head.sha || '' }}
          cururu_language: pt-BR
          cururu_profile: balanced
          cururu_fail_on: off
