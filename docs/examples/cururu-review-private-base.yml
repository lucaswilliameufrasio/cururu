# Example for a private shared base in a separate GitHub organization.
# Keep .cururu.toml and all context files on the trusted base commit.
# The Cururu GitHub App needs Contents (read), Checks (write), Actions (read),
# Pull requests (write) and Issues (write). Create a `cururu-publish`
# environment with required reviewers; the publish job waits for its approval.
name: Cururu PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  gate:
    # Validates comment commands without joining the concurrency group, so
    # unrelated, mis-cased or unauthorized comments never cancel a review.
    # Cururu still checks the commenter's write permission itself.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      run: ${{ steps.command.outputs.run }}
    steps:
      - name: Accept PR events and exact commands from collaborators
        id: command
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          run=false
          if [ "$EVENT" = "pull_request_target" ]; then
            run=true
          else
            body="$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR)
                if [ "$body" = "/cururu review" ] || [ "$body" = "/cururu review --full" ]; then
                  run=true
                fi
                ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Only validated events reach this group; a newer review cancels an older one.
    concurrency:
      group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      review_status: ${{ steps.review.outputs.review_status }}
      candidate_digest: ${{ steps.review.outputs.candidate_digest }}
      candidate_uploaded: ${{ steps.keep_candidate.outcome }}
    steps:
      # This token can read the consumer repo and write Cururu PR/issue comments.
      - name: Mint consumer installation token
        id: consumer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CURURU_APP_ID }}
          private-key: ${{ secrets.CURURU_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-checks: write
          permission-actions: read
          permission-pull-requests: write
          permission-issues: write

      # This separate installation token is read-only and scoped to the base repo.
      - name: Mint shared-config installation token
        id: base-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CURURU_APP_ID }}
          private-key: ${{ secrets.CURURU_APP_PRIVATE_KEY }}
          owner: ${{ vars.CURURU_BASE_OWNER }}
          repositories: ${{ vars.CURURU_BASE_REPOSITORY }}
          permission-contents: read

      - name: Review PR
        id: review
        uses: lucaswilliameufrasio/cururu@09a62abe8b69b4dd9027d5a845f3dc25a1cbce3c # v5.0.1
        with:
          github_token: ${{ steps.consumer-token.outputs.token }}
          shared_config_token: ${{ steps.base-token.outputs.token }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          expected_head_sha: ${{ github.event.pull_request.head.sha || '' }}
          cururu_language: pt-BR
          cururu_profile: balanced
          cururu_fail_on: off
      - name: Keep candidate for the publish job
        id: keep_candidate
        if: ${{ !cancelled() && steps.review.outputs.review_status == 'pending_approval' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cururu-candidate
          path: cururu-candidate.json
          retention-days: 7

  publish:
    needs: review
    # !cancelled() keeps a candidate publishable when the review job fails only
    # on the configured quality gate; the candidate must have been stored.
    if: >-
      ${{ !cancelled() &&
          needs.review.outputs.review_status == 'pending_approval' &&
          needs.review.outputs.candidate_uploaded == 'success' }}
    # Required reviewers on this environment approve the exact candidate.
    environment: cururu-publish
    # A newer review supersedes a publication still waiting for approval.
    concurrency:
      group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This token can read the consumer repo and write Cururu PR/issue comments.
      - name: Mint consumer installation token
        id: consumer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CURURU_APP_ID }}
          private-key: ${{ secrets.CURURU_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-checks: write
          permission-actions: read
          permission-pull-requests: write
          permission-issues: write

      # This separate installation token is read-only and scoped to the base repo.
      - name: Mint shared-config installation token
        id: base-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CURURU_APP_ID }}
          private-key: ${{ secrets.CURURU_APP_PRIVATE_KEY }}
          owner: ${{ vars.CURURU_BASE_OWNER }}
          repositories: ${{ vars.CURURU_BASE_REPOSITORY }}
          permission-contents: read

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cururu-candidate
      - name: Publish approved review
        uses: lucaswilliameufrasio/cururu@09a62abe8b69b4dd9027d5a845f3dc25a1cbce3c # v5.0.1
        with:
          mode: publish
          github_token: ${{ steps.consumer-token.outputs.token }}
          shared_config_token: ${{ steps.base-token.outputs.token }}
          candidate_digest: ${{ needs.review.outputs.candidate_digest }}
