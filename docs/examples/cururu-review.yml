# Example: add this file as .github/workflows/cururu-review.yml in a consumer repository.
#
# Requirements:
#   1. Add LLM_API_KEY as a repository secret.
#   2. Optionally add .cururu.toml at the repository root.
#   3. Keep only one Cururu review workflow active for the repository.

name: Cururu PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

concurrency:
  group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: (github.event_name == 'issue_comment' || github.event.pull_request.draft == false) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check LLM API key
        id: llm_key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM_API_KEY is not configured - skipping Cururu review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Review PR
        if: steps.llm_key.outputs.skip == 'false'
        uses: lucaswilliameufrasio/cururu@ee65b0ef0211a9a79ce14a2af597b45964ca7b8f # v4.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          cururu_language: pt-BR
          cururu_profile: balanced
          cururu_fail_on: off
