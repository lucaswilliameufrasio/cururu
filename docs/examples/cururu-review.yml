# Example: add this file as .github/workflows/cururu-review.yml in a consumer repository.
#
# Requirements:
#   1. Add LLM_API_KEY as a repository secret.
#   2. Create the `cururu-publish` environment (Settings > Environments) with
#      required reviewers. Cururu refuses to publish without that protection.
#   3. Optionally add .cururu.toml at the repository root.
#   4. Keep only one Cururu review workflow active for the repository.
#
# The review job comments nothing: it shows the exact candidate in the job
# summary and in a "Cururu review" check. A required reviewer approves the
# publish job in the run page, or runs `cururu approve-hosted-review --pr N`.

name: Cururu PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Draft PRs are reviewed on ready_for_review, not on each draft push.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
         startsWith(github.event.comment.body, '/cururu review'))
      )
    # Job-level, so a skipped job (e.g. an unrelated or bot comment) never
    # cancels a review that is already running.
    concurrency:
      group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      review_status: ${{ steps.review.outputs.review_status }}
      candidate_digest: ${{ steps.review.outputs.candidate_digest }}
    steps:
      - name: Check LLM API key
        id: llm_key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM_API_KEY is not configured - skipping Cururu review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Review PR
        id: review
        if: steps.llm_key.outputs.skip == 'false'
        uses: lucaswilliameufrasio/cururu@601b4e125b7dd865c6adab289d2d8948f1e5c841 # v4.8.0 — replace with the first v5 release: v4 publishes without approval and has no publish mode
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          expected_head_sha: ${{ github.event.pull_request.head.sha || '' }}
          cururu_language: pt-BR
          cururu_profile: balanced
          cururu_fail_on: off
      - name: Keep candidate for the publish job
        if: ${{ !cancelled() && steps.review.outputs.review_status == 'pending_approval' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cururu-candidate
          path: cururu-candidate.json
          retention-days: 7

  publish:
    needs: review
    if: ${{ !cancelled() && needs.review.outputs.review_status == 'pending_approval' }}
    # Required reviewers on this environment approve the exact candidate.
    environment: cururu-publish
    # A newer review supersedes a publication still waiting for approval.
    concurrency:
      group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cururu-candidate
      - name: Publish approved review
        uses: lucaswilliameufrasio/cururu@601b4e125b7dd865c6adab289d2d8948f1e5c841 # v4.8.0 — replace with the first v5 release: v4 publishes without approval and has no publish mode
        with:
          mode: publish
          github_token: ${{ secrets.GITHUB_TOKEN }}
          candidate_digest: ${{ needs.review.outputs.candidate_digest }}
