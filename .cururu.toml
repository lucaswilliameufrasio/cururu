version = 1

[provider]
name = "openrouter"
model = "openai/gpt-5.6-luna"
temperature = 0.1
max_output_tokens = 4000

[review]
max_diff_bytes = 180000
chunk_bytes = 45000
ignore = [
  "**/target/**",
  "**/*.lock",
  "**/dist/**",
  "**/build/**",
]
language = "pt-BR"
comment_mode = "inline"

[policy]
minimum_confidence = 0.65
max_findings = 30
fail_on = "off"
allowed_severities = ["critical", "high", "medium", "low"]
suggested_changes = false
incremental = false
synthesis = false
focus = []

[context]
conventions = [
  "CONTRIBUTING.md",
  "AGENTS.md",
]
specifications = [
  "docs/specs/**/*.md",
  "docs/sdd/**/*.md",
  "docs/gdd/**/*.md",
]
skills = []
additional = [
  "docs/adr/**/*.md",
]
max_bytes = 100000

[context.auto]
enabled = false
max_bytes = 50000
max_files = 20
per_file_bytes = 12000
include = ["src/**", "tests/**"]
exclude = ["**/generated/**", "**/*.min.js"]

[summary]
show_cost = false
show_usage = true

[analysis]
enabled = false
manifest = "artifacts/analysis.json"
sarif_paths = ["artifacts/**/*.sarif"]
max_findings = 100
require_current_head = true
check_runs = false
check_run_names = []
