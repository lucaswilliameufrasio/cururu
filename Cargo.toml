[package]
name = "cururu"
version = "4.9.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Self-service AI code review for GitHub pull requests"
repository = "https://github.com/lucaswilliameufrasio/cururu"

[workspace]
members = ["crates/cururu-core", "crates/cururu-engine"]
resolver = "3"

[dependencies]
cururu-core = { path = "crates/cururu-core", version = "0.1.0" }
cururu-engine = { path = "crates/cururu-engine", version = "0.1.0" }
anyhow = "1.0"
axum = "0.8"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
globset = "0.4"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
hmac = "0.13"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "zstd"] }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "postgres", "sqlite"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "fs", "net", "signal", "time"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
jsonc-parser = { version = "0.34.0", features = ["cst"] }
tempfile = "3.27"

[dev-dependencies]
insta = { version = "1.49", features = ["json"] }
temp-env = "0.3"
tempfile = "3.27"
wiremock = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
