[package]
name = "cururu-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Reusable execution contracts for Cururu code review"
repository = "https://github.com/lucaswilliameufrasio/cururu"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
cururu-core = { path = "../cururu-core", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1.46", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
