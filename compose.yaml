services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cururu
      POSTGRES_PASSWORD: ${CURURU_DB_PASSWORD:?Set CURURU_DB_PASSWORD in .env}
      POSTGRES_DB: cururu
    volumes:
      - cururu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cururu -d cururu"]
      interval: 10s
      timeout: 5s
      retries: 5

  cururu:
    build: .
    command: ["serve"]
    restart: unless-stopped
    environment:
      PORT: "8080"
      CURURU_DATABASE_URL: postgresql://cururu:${CURURU_DB_PASSWORD:?Set CURURU_DB_PASSWORD in .env}@postgres:5432/cururu
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set GITHUB_APP_ID in .env}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:?Set GITHUB_APP_SLUG in .env}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET in .env}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_SERVER_URL: ${GITHUB_SERVER_URL:-https://github.com}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
    ports:
      - "127.0.0.1:${CURURU_PORT:-8080}:8080"
    secrets:
      - github_app_private_key
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.30.4-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/cururu.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cururu:
        condition: service_started

secrets:
  github_app_private_key:
    file: ${GITHUB_APP_PRIVATE_KEY_FILE:?Set GITHUB_APP_PRIVATE_KEY_FILE in .env}

volumes:
  cururu-postgres:
