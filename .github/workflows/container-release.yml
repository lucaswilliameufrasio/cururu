name: Container Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read
  packages: write

concurrency:
  group: cururu-container-release
  queue: max

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate stable SemVer tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported container release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate platform tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM_SUFFIX: ${{ matrix.suffix }}
        run: |
          TAG="$IMAGE:$RELEASE_TAG-$PLATFORM_SUFFIX"
          echo "tags=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "tags=$TAG" >> "$GITHUB_OUTPUT"

      - name: Docker labels
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.suffix }}
          provenance: true
          sbom: true

      - name: Smoke test
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM_SUFFIX: ${{ matrix.suffix }}
        run: |
          docker run --rm --workdir /github/workspace \
            "$IMAGE:$RELEASE_TAG-$PLATFORM_SUFFIX" \
            --version

  merge:
    needs: build
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate stable SemVer tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported container release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multiarch manifest
        run: |
          MAJOR="${RELEASE_TAG%%.*}"
          docker buildx imagetools create \
            -t "$IMAGE:$RELEASE_TAG" \
            -t "$IMAGE:$MAJOR" \
            -t "$IMAGE:latest" \
            "$IMAGE:$RELEASE_TAG-amd64" \
            "$IMAGE:$RELEASE_TAG-arm64"

      - name: Image summary
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{.Manifest.Digest}}')
          {
            echo "## Image released"
            echo ""
            echo "**Repository:** \`${{ github.repository }}\`"
            echo "**Tags:** \`$RELEASE_TAG\`, \`${RELEASE_TAG%%.*}\`, \`latest\`"
            echo "**Manifest digest:** \`$DIGEST\`"
            echo ""
            echo "### Platforms"
            echo '```'
            docker manifest inspect "$IMAGE:$RELEASE_TAG" --verbose 2>/dev/null
            echo '```'
            echo ""
            echo "Pin this digest in \`action.yml\`:"
            echo "\`\`\`yaml"
            echo "image: docker://$IMAGE@$DIGEST"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout main for digest pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Pin digest in action.yml and move major tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{.Manifest.Digest}}')
          sed -i "s#image: docker://$IMAGE[@:].*#image: docker://$IMAGE@$DIGEST#" action.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "action.yml already pinned to this digest"
          else
            git commit -am "chore: pin $RELEASE_TAG OCI digest"
            git push origin main
          fi

          MAJOR="${RELEASE_TAG%%.*}"
          git tag -f "$MAJOR" HEAD
          git push -f origin "$MAJOR"
