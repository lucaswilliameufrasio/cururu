name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate platform tags
        id: tags
        run: |
          TAG="ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.suffix }}"
          echo "tags=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "tags=$TAG" >> "$GITHUB_OUTPUT"

      - name: Docker labels
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.suffix }}
          provenance: true
          sbom: true

      - name: Smoke test
        run: |
          docker run --rm --workdir /github/workspace \
            "ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.suffix }}" \
            --version

  merge:
    needs: build
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multiarch manifest
        run: |
          IMG="ghcr.io/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          MAJOR="v$(echo $TAG | sed 's/v\([0-9]*\).*/\1/')"
          docker buildx imagetools create \
            -t "$IMG:$TAG" \
            -t "$IMG:$MAJOR" \
            -t "$IMG:latest" \
            "$IMG:$TAG-amd64" \
            "$IMG:$TAG-arm64"

      - name: Image summary
        run: |
          IMG="ghcr.io/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          DIGEST=$(docker buildx imagetools inspect "$IMG:$TAG" --format '{{.Manifest.Digest}}')
          {
            echo "## Image released"
            echo ""
            echo "**Repository:** \`${{ github.repository }}\`"
            echo "**Tags:** \`$TAG\`, \`v$(echo $TAG | sed 's/v\([0-9]*\).*/\1/')\`, \`latest\`"
            echo "**Manifest digest:** \`$DIGEST\`"
            echo ""
            echo "### Platforms"
            echo '```'
            docker manifest inspect "$IMG:$TAG" --verbose 2>/dev/null
            echo '```'
            echo ""
            echo "Pin this digest in \`action.yml\`:"
            echo "\`\`\`yaml"
            echo "image: docker://$IMG@$DIGEST"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout main for digest pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Pin digest in action.yml and move major tag
        env:
          TAG: ${{ github.ref_name }}
          IMG: ghcr.io/${{ github.repository }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMG:$TAG" --format '{{.Manifest.Digest}}')
          sed -i "s#image: docker://$IMG[@:].*#image: docker://$IMG@$DIGEST#" action.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "action.yml already pinned to this digest"
          else
            git commit -am "chore: pin $TAG OCI digest"
            git push origin main
          fi

          MAJOR="v$(echo $TAG | sed 's/v\([0-9]*\).*/\1/')"
          git tag -f "$MAJOR" HEAD
          git push -f origin "$MAJOR"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes --verify-tag 2>/dev/null \
            || echo "release $TAG already exists"
