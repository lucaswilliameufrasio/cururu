name: Cururu PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  gate:
    # Validates comment commands without joining the concurrency group, so
    # unrelated, mis-cased or unauthorized comments never cancel a review.
    # Cururu still checks the commenter's write permission itself.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      run: ${{ steps.command.outputs.run }}
    steps:
      - name: Accept PR events and exact commands from collaborators
        id: command
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          run=false
          if [ "$EVENT" = "pull_request_target" ]; then
            run=true
          else
            body="$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR)
                if [ "$body" = "/cururu review" ] || [ "$body" = "/cururu review --full" ]; then
                  run=true
                fi
                ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  review:
    # Automatic PR reviews wait until a draft is marked ready; collaborators
    # can still request a review through issue_comment.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Only validated events reach this group; a newer review cancels an older one.
    concurrency:
      group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      review_status: ${{ steps.review.outputs.review_status }}
      candidate_digest: ${{ steps.review.outputs.candidate_digest }}
      candidate_uploaded: ${{ steps.keep_candidate.outcome }}
    steps:
      - name: Check LLM API key
        id: llm_key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM_API_KEY is not configured — skipping Cururu review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Review PR
        id: review
        if: steps.llm_key.outputs.skip == 'false'
        uses: lucaswilliameufrasio/cururu@39f2c14b8730af65779e0a2d24eb0167db4165c6 # v5.1.0
        with:
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          expected_head_sha: ${{ github.event.pull_request.head.sha || '' }}
          cururu_language: pt-BR
          cururu_profile: balanced
          cururu_fail_on: off
      - name: Keep candidate for the publish job
        id: keep_candidate
        if: ${{ !cancelled() && steps.review.outputs.review_status == 'pending_approval' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cururu-candidate
          path: cururu-candidate.json
          retention-days: 7

  publish:
    needs: review
    # !cancelled() keeps a candidate publishable when the review job fails only
    # on the configured quality gate; the candidate must have been stored.
    if: >-
      ${{ !cancelled() &&
          needs.review.outputs.review_status == 'pending_approval' &&
          needs.review.outputs.candidate_uploaded == 'success' }}
    # Required reviewers on this environment approve the exact candidate.
    environment: cururu-publish
    # A newer review supersedes a publication still waiting for approval.
    concurrency:
      group: cururu-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cururu-candidate
      - name: Publish approved review
        uses: lucaswilliameufrasio/cururu@39f2c14b8730af65779e0a2d24eb0167db4165c6 # v5.1.0
        with:
          mode: publish
          github_token: ${{ secrets.GITHUB_TOKEN }}
          candidate_digest: ${{ needs.review.outputs.candidate_digest }}
